def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file("signing.properties")
if (signingPropertiesFile.isFile()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

def signingValue = { String environmentName, String propertyName ->
    System.getenv(environmentName) ?: signingProperties.getProperty(propertyName)
}

def keystorePath = signingValue("WEARTAK_DEBUG_KEYSTORE_FILE", "DEBUG_KEYSTORE_FILE")
if (!keystorePath) {
    return
}

android {
    signingConfigs {
        weartakDebugGitlab {
            storeFile rootProject.file(keystorePath)
            storePassword signingValue("WEARTAK_DEBUG_STORE_PASSWORD", "DEBUG_STORE_PASSWORD")
            keyAlias signingValue("WEARTAK_DEBUG_KEY_ALIAS", "DEBUG_KEY_ALIAS")
            keyPassword signingValue("WEARTAK_DEBUG_KEY_PASSWORD", "DEBUG_KEY_PASSWORD")
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.weartakDebugGitlab
        }
    }
}
