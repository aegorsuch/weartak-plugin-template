/**
 * Debug signing for sideload parity with the WearTAK host debug build.
 *
 * The plugin repo uses the copied host keystore at {@code keystore/weartak.keystore}
 * with the same signing values as {@code WEAR-508-509_Managed_Config/app/build.gradle}.
 */
def sideloadKs = rootProject.file("keystore/weartak.keystore")
if (!sideloadKs.isFile()) {
    return
}

android {
    signingConfigs {
        weartakReleaseSideload {
            storeFile sideloadKs
            storePassword '112358key!'
            keyAlias 'platform'
            keyPassword '112358key!'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.weartakReleaseSideload
        }
    }
}
