include:
  - project: devsecops/gitlab-ci-common
    ref: master
    file: /template/artifactory_token_service.yml

# Keep non-Gradle jobs from inheriting the included template's package setup.
before_script: []

variables:
  GRADLE_BUILD_LAUNCHER_TAG: "2.6.2"
  KUBERNETES_MEMORY_LIMIT: "8Gi"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

stages:
  - test
  - build
  - publish

.gradle_image:
  image:
    name: ${TAK_REGISTRY_HOST}/devsecops/gradle-build-launcher:17-${GRADLE_BUILD_LAUNCHER_TAG}
    entrypoint: [""]

.artifactory_credentials:
  extends: .artifactory_service_create_token_no_depends_bash
  before_script:
    - !reference [.artifactory_service_create_token_no_depends_bash, before_script]
    - export ARTIFACTORY_USER="$GITLAB_USER_EMAIL" ARTIFACTORY_PASSWORD="$CI_JOB_ARTIFACTORY_TOKEN"

release_publisher_tests:
  stage: test
  image:
    name: python:3.12-slim
    entrypoint: [""]
  extends: .artifactory_service_create_token_bash
  script:
    - python -m unittest discover -s ci/tests -v
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_COMMIT_TAG'

release_checklist_tests:
  stage: test
  image:
    name: node:22-slim
    entrypoint: [""]
  extends: .artifactory_service_create_token_bash
  script:
    - node --test ci/release-testing/create_release_test_issue.test.cjs
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_COMMIT_TAG'

# Unit tests and debug build never use production signing credentials.
unit_tests:
  extends: [.gradle_image, .artifactory_credentials]
  stage: test
  interruptible: true
  script:
    - chmod +x gradlew
    - ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: app/build/test-results/testDebugUnitTest/*.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_COMMIT_TAG'

.release_build:
  extends: [.gradle_image, .artifactory_credentials]
  stage: build
  before_script:
    - !reference [.artifactory_credentials, before_script]
    - chmod +x gradlew
    - |
      for var in WEARTAK_RELEASE_KEYSTORE_B64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
        [ -n "$(printenv "$var")" ] || { echo "ERROR: Missing $var"; exit 1; }
      done
    - printf '%s' "$WEARTAK_RELEASE_KEYSTORE_B64" | base64 -d > "$CI_PROJECT_DIR/app/weartak.keystore"
    - chmod 600 "$CI_PROJECT_DIR/app/weartak.keystore"
    - |
      cat > signing.properties <<EOF
      RELEASE_KEYSTORE_FILE=app/weartak.keystore
      RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD
      RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS
      RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD
      EOF
    - chmod 600 signing.properties
    - keytool -list -keystore app/weartak.keystore -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" >/dev/null
    - echo "Production signing credentials verified."
  script:
    - ./gradlew --no-daemon clean :app:assembleRelease
    - |
      set -eu
      APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -1)"
      [ -n "$APK" ] || { echo "ERROR: No release APK"; exit 1; }
      SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/opt/android-sdk-linux}}"
      APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1)"
      [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ] || { echo "ERROR: apksigner missing"; exit 1; }
      EXPECTED="1579b600cd84e619e76a91c2db6b031938c999bc2aad926b9a51ec2b166d348d"
      "$APKSIGNER" verify "$APK" || { echo "ERROR: APK signature verification failed."; exit 1; }
      ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr '[:upper:]' '[:lower:]')"
      echo "APK: $APK"
      echo "Expected signer: $EXPECTED"
      echo "Actual signer:   $ACTUAL"
      [ "$ACTUAL" = "$EXPECTED" ] || { echo "ERROR: Unexpected signing certificate"; exit 1; }
      echo "Release signing verified."
      sha256sum "$APK" > app/build/outputs/apk/release/verified-apk.sha256
  after_script:
    - rm -f app/weartak.keystore signing.properties

default_branch_release:
  extends: .release_build
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/apk/release/verified-apk.sha256
      - app/build/outputs/apk/release/output-metadata.json
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'

official_release:
  extends: .release_build
  artifacts:
    when: always
    expire_in: never
    paths:
      - app/build/outputs/apk/release/*.apk
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$/'

publish_github_default:
  stage: publish
  image:
    name: python:3.12-slim
    entrypoint: [""]
  extends: .artifactory_service_create_token_bash
  dependencies:
    - default_branch_release
  resource_group: weartak-plugin-github-release
  interruptible: false
  script:
    - python ci/publish_github_release.py
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "push"'
